---
- name: Install tailscale
  community.general.pacman:
    name: tailscale
    state: present
  become: true

# tailscaled needs the tun module to create tailscale0; without it the daemon
# crashes with tstun.New("tailscale0"): no such device. persistent:true writes
# /etc/modules-load.d so it survives reboot / fresh provision.
- name: Load tun kernel module
  community.general.modprobe:
    name: tun
    state: present
    persistent: present
  become: true

- name: Enable tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  become: true

- name: Read Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  check_mode: false

# The auth key is bootstrap-only. Existing machines retain their node identity;
# only a logged-out or fresh machine runs `tailscale up`.
- name: Join tailnet when not already connected
  ansible.builtin.shell: |
    set -o pipefail
    set -a; source {{ ansible_facts["env"]["HOME"] | quote }}/.secrets; set +a
    tailscale up --authkey="$TAILSCALE_AUTHKEY"
  args:
    executable: /bin/bash
  become: true
  when: (tailscale_status.stdout | from_json).BackendState != "Running"
  changed_when: true
  no_log: true

# Preserve the tunnel while keeping host DNS under NetworkManager control.
- name: Read Tailscale DNS preference
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs
  changed_when: false
  check_mode: false

- name: Disable Tailscale DNS acceptance
  ansible.builtin.command: tailscale set --accept-dns=false
  become: true
  when: (tailscale_prefs.stdout | from_json).CorpDNS | default(true)
  changed_when: true
