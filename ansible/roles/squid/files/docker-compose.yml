services:
  squid:
    image: yegor256/squid-proxy@sha256:607e6d908a1679380a0d1bd2d79896a2c3ed26262e4bd33f9f9cd2d1f6b60dc4

    restart: unless-stopped
    ports:
      - "${SQUID_HOST:-127.0.0.1}:${SQUID_PORT:-3128}:3128"
    environment:
      - USERNAME=${SQUID_USERNAME}
      - PASSWORD=${SQUID_PASSWORD}
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "squid -k check || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
